      {ids:['os0','os1','os2','os3','os4','os5','os6'],cls:'hs',ann:{id:'os0',t:'正确时机 ✓',c:'ao'}},
    ],
    nHL:[
      {ids:['nr0','nr1'],cls:'hw',ann:{id:'nr1',t:'移除 initXxx 调用',c:'aw'}},
      {ids:['na0','na1','na2'],cls:'ha'},
      {ids:['ni0','ni1','ni2','ni3'],cls:'hw',ann:{id:'ni0',t:'应在 action 校验后调用',c:'aw'}},
      {ids:['ri1','ri2'],cls:'he',ann:{id:'ri2',t:'← 从这里移走',c:'ab'}},
    ],
    os:{cls:'ss', b:`<span class="sg">旧代码行为正确，无需修改</span>\n\n<span class="sv">Rally guard 始终在状态变更之前</span>\n<span class="sg">→ NewTroopExtra 始终安全</span>`},
    ns:{cls:'sn', b:`<span class="sw">修复步骤：</span>\n<span class="sd">1. resolveMarchUnits 中删除 initPlayerTroopMarchState 调用</span>\n<span class="sd">2. 在 checkActionCondition 通过后插入：</span>\n   <span class="sv">wmap</span>.<span class="kw" style="color:#82aaff">initPlayerTroopMarchState</span>(<span class="sv">playerID</span>, <span class="sv">req.GetTargetID()</span>, <span class="sv">startUnit</span>)`},
  },
];

// ── render ─────────────────────────────────────────────────────────────────────
function buildCode(lines, cid) {
  const el = document.getElementById(cid);
  el.innerHTML = '';
  lines.forEach(l => {
    if (l.sep) { const d=document.createElement('div'); d.className='sep'; el.appendChild(d); return; }
    const d = document.createElement('div');
    d.className = 'cl';
    if (l.id) d.dataset.id = l.id;
    d.innerHTML = `<div class="ln">${l.n??''}</div><div class="lc">${l.c}</div>`;
    el.appendChild(d);
  });
}

function buildInd() {
  const el = document.getElementById('ind');
  el.innerHTML = '';
  STEPS.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = s.t;
    d.addEventListener('click', () => go(i));
    el.appendChild(d);
  });
}

function clearHL(cid) {
  document.querySelectorAll(`#${cid} .cl`).forEach(el => {
    el.className = 'cl';
    const a = el.querySelector('.ann'); if(a) a.remove();
  });
}

function applyHL(cid, hls) {
  hls.forEach(hl => {
    hl.ids.forEach(id => {
      const el = document.querySelector(`#${cid} [data-id="${id}"]`);
      if (!el) return;
      el.classList.remove('ha','hb','hs','he','hw','hd');
      el.classList.add(hl.cls);
      if (hl.ann && hl.ann.id === id) {
        const s = document.createElement('span');
        s.className = `ann ${hl.ann.c}`;
        s.textContent = hl.ann.t;
        el.appendChild(s);
      }
    });
  });
}

function scrollTo(cid, hls) {
  const ids = hls.flatMap(h=>h.ids).filter(id=>!hls.find(h=>h.ids.includes(id)&&h.cls==='hd'));
  if (!ids.length) return;
  const first = document.querySelector(`#${cid} [data-id="${ids[0]}"]`);
  if (first) {
    const body = document.getElementById(cid);
    const off = first.offsetTop - body.offsetTop - 60;
    body.scrollTo({top: Math.max(0, off), behavior:'smooth'});
  }
}

let cur = -1;
function go(i) {
  if (i<0||i>=STEPS.length) return;
  cur = i;
  const s = STEPS[i];
  document.getElementById('dt').textContent = s.t;
  document.getElementById('dh').textContent = s.h;
  document.getElementById('pOld').className = 'panel' + (s.bug?' p-ok':'');
  document.getElementById('pNew').className = 'panel' + (s.bug?' p-bug':'');
  clearHL('bOld'); applyHL('bOld', s.oHL); scrollTo('bOld', s.oHL);
  clearHL('bNew'); applyHL('bNew', s.nHL); scrollTo('bNew', s.nHL);
  document.getElementById('sOld').className = `sbox ${s.os.cls}`;
  document.getElementById('sOb').innerHTML  = s.os.b;
  document.getElementById('sNew').className = `sbox ${s.ns.cls}`;
  document.getElementById('sNb').innerHTML  = s.ns.b;
  document.querySelectorAll('.dot').forEach((d,idx) => {
    d.className = 'dot' + (STEPS[idx].bug ? ' b' : '') + (idx===i ? 'active' : idx<i ? 'done' : '');
  });
  document.getElementById('bPrev').disabled = (i===0);
  document.getElementById('bNext').disabled = (i===STEPS.length-1);
  document.getElementById('bNext').textContent = i===STEPS.length-1 ? '完成 ✓' : '下一步 →';
  document.getElementById('sc').textContent = `${i+1} / ${STEPS.length}`;
}

buildCode(OLD,'bOld');
buildCode(NEW,'bNew');
buildInd();
go(0);
document.getElementById('bNext').addEventListener('click',()=>go(cur+1));
document.getElementById('bPrev').addEventListener('click',()=>go(cur-1));
</script>
</body>
</html>
