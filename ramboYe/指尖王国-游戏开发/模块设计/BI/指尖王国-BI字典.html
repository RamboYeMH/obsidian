<script>
const sheets = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 0;
try { const t = localStorage.getItem('bi-dict-tab'); if (t !== null && sheets[+t]) cur = +t; } catch (e) {}

function hl(text, q) {
  const e = esc(text);
  if (!q) return e;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return e;
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function renderTabs() {
  $('#tabs').innerHTML = sheets.map((s, i) =>
    `<button class="${i === cur ? 'on' : ''}" data-i="${i}">${esc(s.name)}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    cur = +b.dataset.i;
    try { localStorage.setItem('bi-dict-tab', cur); } catch (e) {}
    renderTabs(); render();
  });
}

function renderDict(s, q) {
  const hdr = s.header;
  let nShown = 0;
  const secs = [], nav = [];
  s.events.forEach((ev, idx) => {
    const head = (ev.name + ' ' + ev.table).toLowerCase();
    const evHit = !q || head.includes(q);
    const rows = evHit ? ev.fields : ev.fields.filter(f => f.join(' ').toLowerCase().includes(q));
    if (!rows.length) return;
    nShown++;
    const id = 'ev' + idx;
    nav.push(`<a href="#${id}">${esc(ev.name || ev.table || '(未命名)')} <small>${esc(ev.table)}</small></a>`);
    secs.push(`<section id="${id}"><h2>${hl(ev.name || '(未命名)', q)} ${ev.table ? '<code>' + hl(ev.table, q) + '</code>' : ''}</h2>
      <div class="table-wrap"><table><thead><tr>${hdr.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(f => `<tr>${hdr.map((_, i) => `<td>${hl(f[i] || '', q)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div></section>`);
  });
  $('#cnt').textContent = `${nShown} / ${s.events.length} 个事件`;
  return secs.length
    ? `<div class="layout"><aside>${nav.join('')}</aside><div>${secs.join('')}</div></div>`
    : '<div class="empty">没有匹配项</div>';
}

function renderRaw(s, q) {
  const rows = q ? s.rows.filter(r => r.join(' ').toLowerCase().includes(q)) : s.rows;
  $('#cnt').textContent = `${rows.length} / ${s.rows.length} 行`;
  if (!rows.length) return '<div class="empty">没有匹配项</div>';
  return `<section><h2>${esc(s.name)}</h2><div class="table-wrap"><table class="raw"><tbody>
    ${rows.map(r => `<tr>${r.map(c => `<td class="${c.length > 120 ? 'long' : ''}">${hl(c, q)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></section>`;
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const s = sheets[cur];
  $('#main').innerHTML = s.events ? renderDict(s, q) : renderRaw(s, q);
}

$('#q').addEventListener('input', render);
renderTabs(); render();
</script>
